<!doctype html>
<meta charset="utf-8">
<title>Seed local Astrohealth demo data</title>
<pre id="result">Running seed…</pre>
<script type="module">
  import { db } from '/src/db/index.ts';
  import { DEMO_ACCOUNT_IDS, seedFictionalCrew } from '/src/services/simulator.ts';

  const seeded = await seedFictionalCrew({ reset: true });
  const accountCounts = [];
  for (const id of DEMO_ACCOUNT_IDS) {
    accountCounts.push({
      id,
      measurements: await db.measurements.where('astronautId').equals(id).count(),
      sleepLogs: await db.sleepLogs.where('astronautId').equals(id).count(),
      assessments: await db.psychAssessments.where('astronautId').equals(id).count()
    });
  }
  document.querySelector('#result').textContent = JSON.stringify({ seeded, accountCounts }, null, 2);
</script>
